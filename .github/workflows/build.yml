name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # windows-2022 ships WiX Toolset 3, which jpackage (JDK 21) needs for the .exe installer.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test
        shell: bash
        run: ./gradlew test --no-daemon

      - name: Build jar, app image and installer
        shell: bash
        run: ./gradlew fatJar jpackage --no-daemon

      - name: Collect release files
        shell: pwsh
        run: |
          $ver = (Select-String -Path build.gradle.kts -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/libs/gamesense-essentials-fat-$ver.jar" "dist/gamesense-essentials-hebrew-$ver.jar"
          Copy-Item (Get-ChildItem build/jpackage/*.exe | Select-Object -First 1).FullName "dist/gamesense-essentials-hebrew-$ver-setup.exe"
          Compress-Archive -Path build/jpackage/gamesense-essentials -DestinationPath "dist/gamesense-essentials-hebrew-$ver-portable.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v5
        with:
          name: gamesense-essentials-hebrew
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
